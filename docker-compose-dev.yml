version: "3"
services:
  api:
    build: .
    depends_on:
      - postgres
    volumes:
      - ./:/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload 
    ports:
      - 8000:8000
    # env_file:
    #   - ./.env
    environment:
      - DATABASE_HOSTNAME=postgres
      - DATABASE_PORT=5432
      - DATABASE_PASSWORD=Manish2004
      - DATABASE_NAME=fastapi
      - DATABASE_USERNAME=postgres
      - SECRET_KEY=yDdRA52r3L1ko5Hk5M6mNDWVM8MQzyEwpaSGrEVzLDA
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DATABASE_SSLMODE=disable
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=Manish2004
      - POSTGRES_DB=fastapi
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db: